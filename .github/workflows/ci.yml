name: CI

on:
  pull_request:
    branches: [ develop, main ]

jobs:
  test:
    # Use an explicit Ubuntu runner (latest LTS available to GitHub Actions)
    runs-on: ubuntu-24.04
    services:
      # Use the latest official MongoDB image from Docker Hub
      mongo:
        image: mongo:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Pin Node.js to a known latest release: 26.8.1
          node-version: '26.8.1'

      - name: Install dependencies
        run: npm ci

      - name: Create .env for CI
        run: |
          echo "DB=mongodb://mongo:27017/mern-crud-test" > .env
          echo "PORT=3000" >> .env
          echo "NODE_ENV=test" >> .env

      - name: Wait for MongoDB service (15s)
        run: |
          echo "Waiting for MongoDB on mongo:27017"
          for i in {1..15}; do
            if bash -c "</dev/tcp/mongo/27017" >/dev/null 2>&1; then
              echo "Mongo is reachable"; exit 0
            fi
            echo "Waiting for MongoDB... ($i)"; sleep 1
          done
          echo "Timed out waiting for MongoDB; continuing without failing the job"

      - name: Start server and wait for readiness
        run: |
          npm start &
          server_pid=$!
          echo "Started server (pid=$server_pid). Waiting for http://127.0.0.1:3000 up to 60s"
          for i in {1..60}; do
            if curl -sS http://127.0.0.1:3000/ >/dev/null 2>&1; then
              echo "Server is up"; break
            fi
            if ! kill -0 "$server_pid" >/dev/null 2>&1; then
              echo "Server process $server_pid exited unexpectedly";
              sleep 1
              break
            fi
            echo "Waiting for server... ($i)"; sleep 1
          done

      - name: Run tests
        env:
          SERVER: http://127.0.0.1:3000
          NODE_ENV: test
        run: npm test

    timeout-minutes: 20
