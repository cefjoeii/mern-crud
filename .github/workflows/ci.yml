name: CI

on:
  pull_request:
    branches: [ develop, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Create .env for CI
        run: |
          echo "DB=mongodb://mongo:27017/mern-crud-test" > .env
          echo "PORT=3000" >> .env
          echo "NODE_ENV=test" >> .env

      - name: Wait for MongoDB service
        run: |
          echo "Waiting for MongoDB on mongo:27017"
          for i in {1..60}; do
            if bash -c "</dev/tcp/mongo/27017" >/dev/null 2>&1; then
              echo "Mongo is reachable"; exit 0
            fi
            echo "Waiting for MongoDB... ($i)"; sleep 2
          done
          echo "Timed out waiting for MongoDB"; exit 1

      - name: Start server
        run: |
          npm start &
          # wait for server to respond on port 3000 (up to ~60s)
          for i in {1..30}; do
            if curl -sS http://127.0.0.1:3000 >/dev/null 2>&1; then
              echo "Server is up"; break
            fi
            echo "Waiting for server... ($i)"; sleep 2
          done

      - name: Run tests
        env:
          SERVER: http://127.0.0.1:3000
        run: npm test
